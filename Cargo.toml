[workspace.package]
version = "30.1.0"
authors = ["Stefan Tammer <st.tammer@gmail.com>"]
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace]
members = ["wgsl_modules", "wgsl_modules/loader", "wgsl_modules/macro"]

[workspace.dependencies]
wgpu = { version = "30", default-features = false }
naga = { version = "30", default-features = false }
anyhow = "1"


[package]
name = "wgx"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "wgx"


[features]
default = ["math", "wgsl_modules"]
math = ["dep:glam"]
math-f64 = ["glam/f64"]
math-i8 = ["glam/i8", "glam/u8"]
math-i16 = ["glam/i16", "glam/u16"]
math-i32 = ["glam/i32", "glam/u32"]
math-i64 = ["glam/i64", "glam/u64"]
math-isize = ["glam/isize", "glam/usize"]
mint = ["dep:mint", "glam?/mint-05"]
serde = ["dep:serde", "glam?/serde", "mint?/serde"]
wgsl_modules = ["dep:wgsl_modules"]
wgsl_modules_loader = ["wgsl_modules", "wgsl_modules/loader", "wgpu/naga-ir"]


[dependencies]
wgpu = { workspace = true, features = ["std", "wgsl", "parking_lot"] }
bytemuck = { version = "1", features = ["derive"] }
anyhow = { workspace = true }
arrayvec = { version = "0.7", default-features = false }

glam = { version = "0.34", default-features = false, optional = true, features = ["std", "bytemuck"] }
mint = { version = "0.5", optional = true }
serde = { version = "1.0", default-features = false, optional = true }
wgsl_modules = { path = "wgsl_modules", optional = true }


[dev-dependencies]
platform = { version = "~1.6", tag = "v1.6", git = "https://github.com/StT191/platform" }
wgpu = { workspace = true, features = ["vulkan", "webgpu", "webgl"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0"